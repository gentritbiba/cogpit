name: Release cores

on:
  workflow_call:
  # A master push that changes the core builds the release binaries, which
  # .github/actions/core-binary caches under the sources' hash; the next
  # release restores them instead of compiling.
  push:
    branches:
      - master
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - shared/mediaTypes.json
      - .github/actions/core-binary/**
      - .github/workflows/core.yml

permissions:
  contents: read

# cogpit-core for every platform Cogpit ships on. The desktop apps carry their
# platform's; the npm launcher carries all five. Linux builds are static
# (musl), so one binary runs on any distro, however old its glibc. Both macOS
# targets build on Apple silicon; the Intel one cross-compiles.
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    name: core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: core
        uses: ./.github/actions/core-binary
        with:
          profile: release
          target: ${{ matrix.target }}

      - name: Require a static Linux binary
        if: runner.os == 'Linux'
        run: |
          file "${{ steps.core.outputs.dir }}/cogpit-core"
          file "${{ steps.core.outputs.dir }}/cogpit-core" | grep -Eq 'static(ally|-pie) linked'

      # core-dist/<platform>-<arch>/, the layout electron-builder and the npm
      # package take it from (bun run build:core --release --stage locally).
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p "core-dist/${{ matrix.platform }}"
          cp "${{ steps.core.outputs.dir }}/cogpit-core${{ runner.os == 'Windows' && '.exe' || '' }}" "core-dist/${{ matrix.platform }}/"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.platform }}
          path: core-dist
          if-no-files-found: error
