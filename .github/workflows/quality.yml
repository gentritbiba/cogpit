name: Quality

on:
  workflow_call:
  push:
    branches:
      - master
      # The long-lived Rust integration branch; its runs also seed the cargo cache its PRs restore.
      - rust
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Public only: the checkout leaves the editions/team submodule empty, and the
  # builds prove it by failing if they emit the edition UI chunk.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      # rust-toolchain.toml pins the version and components.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The server spawns it; every suite that boots a composition needs it.
      - name: Build Rust core
        run: bun run build:core

      - name: Check dependency advisories
        run: bun run check:audit

      - name: Lint
        run: bun run lint

      - name: Check architecture boundaries
        run: bun run check:architecture

      - name: Check agent-vocabulary containment
        run: bun run check:agents

      - name: Check generated Codex protocol
        run: bun run check:codex-protocol

      - name: Check ungoverned duplication
        run: bun run check:duplicates

      - name: Check generated session core
        run: bun run check:cogpit-memory-sync

      - name: Check generated cogpit skill references
        run: bun run check:cogpit-skill-sync

      - name: Type-check production code
        run: bun run typecheck

      - name: Type-check tests
        run: bun run typecheck:tests

      - name: Test application and server with coverage
        run: bun run test:coverage

      - name: Test cogpit-memory
        working-directory: packages/cogpit-memory
        run: bun run test

      - name: Test install-free Cogpit CLI
        working-directory: packages/cogpit-cli
        run: bun run test

      - name: Build cogpit-memory standalone binary
        working-directory: packages/cogpit-memory
        run: bun run build

      - name: Build web application
        env:
          COGPIT_EXPECT_EDITION_UI: absent
        run: bun run build:web

      - name: Build cogpit-memory npm package
        working-directory: packages/cogpit-memory
        run: bun run build:npm

      - name: Verify cogpit-memory package and CLI contracts
        working-directory: packages/cogpit-memory
        run: node scripts/test-package-contract.mjs

      - name: Verify install-free Cogpit package contract
        working-directory: packages/cogpit-cli
        env:
          COGPIT_EXPECT_EDITION_UI: absent
        run: bun run test:contracts

      - name: Verify public plugin packages outside the repository
        run: bun run test:contracts:plugins

  # Kept apart from quality, whose Vitest coverage run already sits close to its timeout.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version and components.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked

  # The Tauri desktop shell (Rust): its own checks, then a release build of the
  # app with the bundled server and renderer, against Linux's WebKitGTK.
  # The shell has platform code on both sides (job objects and toasts on
  # Windows, D-Bus and WebKitGTK on Linux), so its lints and tests run on both.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev

      # rust-toolchain.toml pins the version and components.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # desktop:build also builds the release core in the root workspace.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            desktop -> target

      - name: Install application dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build the desktop app
        if: runner.os == 'Linux'
        working-directory: .
        env:
          COGPIT_EXPECT_EDITION_UI: absent
        run: bun run desktop:build --no-bundle

  # Windows is a release target, but nothing used to exercise it — the win NSIS
  # config sat unbuilt while POSIX assumptions (/tmp, /bin/zsh, "/" joins, bare
  # spawn of .cmd shims) accumulated across the server. This job is deliberately
  # lean: only the checks whose outcome can actually differ by platform.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      # typecheck includes typecheck:memory, which needs this package's own deps
      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build Rust core
        run: bun run build:core

      # The core's stdin-close exit and spawn are what can differ on Windows.
      - name: Test Rust
        if: ${{ matrix.shard == 1 }}
        run: cargo test --locked

      - name: Type-check production code
        run: bun run typecheck

      - name: Test application and server
        run: bun run test --shard=${{ matrix.shard }}/2

      - name: Verify public plugin packages outside the repository
        if: ${{ matrix.shard == 1 }}
        run: bun run test:contracts:plugins

      - name: Test install-free Cogpit CLI
        if: ${{ matrix.shard == 1 }}
        working-directory: packages/cogpit-cli
        run: bun run test

  windows:
    if: ${{ always() }}
    needs: [windows-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require both Windows shards
        env:
          SHARD_RESULT: ${{ needs.windows-tests.result }}
        run: test "$SHARD_RESULT" = success
