name: Quality

on:
  workflow_call:
    inputs:
      edition:
        description: Check the release build, which carries the edition package, instead of the public one
        type: boolean
        default: false
  push:
    branches:
      - master
      # The long-lived Rust integration branch; its runs also seed the cargo cache its PRs restore.
      - rust
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request keeps only its newest run. Every pushed commit keeps its
  # own, because a release waits on the run for its tag's commit. A called run
  # shares its caller's workflow name, so `edition` keeps a release's two apart.
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ inputs.edition && 'edition' || 'public' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job is independent, so the run takes as long as its slowest job. The
# public run leaves the editions/team submodule empty, and its builds prove it
# by failing if they emit the edition UI chunk; the edition run (release only)
# checks out the package and checks the build that ships.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.edition && 'release' || '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        if: inputs.edition
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}
          require-merged: "true"

      # typecheck:memory needs cogpit-memory's own dependencies.
      - uses: ./.github/actions/setup-js
        with:
          memory: "true"

      - name: Lint, type-check and check generated files, boundaries and advisories
        run: >-
          bun scripts/run-parallel.ts
          typecheck typecheck:tests lint
          check:architecture check:agents check:codex-protocol check:duplicates
          check:cogpit-memory-sync check:cogpit-skill-sync check:audit

  # The suite, split across runners. Each shard of the public run records its
  # coverage in a blob; `coverage` merges them and checks the thresholds.
  test:
    name: test (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.edition && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        if: inputs.edition
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      # The server spawns it; every suite that boots a composition needs it.
      - uses: ./.github/actions/core-binary

      - uses: ./.github/actions/setup-js

      - name: Test with coverage
        if: ${{ !inputs.edition }}
        run: >-
          bunx vitest run --shard=${{ matrix.shard }}/6 --reporter=dot --reporter=blob
          --coverage --coverage.reporter=text-summary
          --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0

      - name: Test with the edition package
        if: inputs.edition
        run: bunx vitest run --shard=${{ matrix.shard }}/6 --reporter=dot

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.edition }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  coverage:
    if: ${{ !inputs.edition }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js
        with:
          generated: "false"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge the shards' coverage and check the thresholds
        run: bunx vitest run --merge-reports --coverage --reporter=dot

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.edition && 'release' || '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        if: inputs.edition
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}
          require-merged: "true"

      # The install-free CLI's package contract starts its server on this core.
      - uses: ./.github/actions/core-binary
        if: ${{ !inputs.edition }}

      - uses: ./.github/actions/setup-js
        with:
          memory: ${{ !inputs.edition }}

      - name: Build the web and Electron apps and check the package contracts
        if: ${{ !inputs.edition }}
        env:
          COGPIT_EXPECT_EDITION_UI: absent
        run: >-
          bun scripts/run-parallel.ts
          "--cwd packages/cogpit-cli test:contracts" build:web electron:build test:contracts:plugins
          "--cwd packages/cogpit-cli test" "--cwd packages/cogpit-memory test"

      - name: Build and check the cogpit-memory packages
        if: ${{ !inputs.edition }}
        working-directory: packages/cogpit-memory
        run: |
          bun run build
          bun run build:npm
          node scripts/test-package-contract.mjs

      - name: Build the web app with the edition UI and as a public clone
        if: inputs.edition
        run: >-
          bun scripts/run-parallel.ts
          "COGPIT_EXPECT_EDITION_UI=present build:web"
          "COGPIT_WITHOUT_TEAM=1 COGPIT_EXPECT_EDITION_UI=absent build:web --outDir $RUNNER_TEMP/public-dist"

      - name: Check the public build carries none of the edition package
        if: inputs.edition
        run: bun editions/team/tools/check-public-bundle.ts "$RUNNER_TEMP/public-dist"

  rust:
    if: ${{ !inputs.edition }}
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # On Windows only the tests: the core's stdin-close exit and spawn are what differ there.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version and components.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lint Rust
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked

  # Windows is a release target. The suite runs here too, because POSIX
  # assumptions (/tmp, /bin/zsh, "/" joins, bare spawn of .cmd shims) only
  # fail on it. Types and builds do not differ, so they run on Linux only.
  windows:
    if: ${{ !inputs.edition }}
    name: windows (${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/core-binary

      - uses: ./.github/actions/setup-js

      - name: Test application and server
        run: bunx vitest run --shard=${{ matrix.shard }}/6 --reporter=dot

      - name: Verify public plugin packages outside the repository
        if: matrix.shard == 1
        run: bun run test:contracts:plugins

      - name: Test install-free Cogpit CLI
        if: matrix.shard == 2
        working-directory: packages/cogpit-cli
        run: bun run test

  # The one check to require: green only when every job above passed.
  quality:
    if: always()
    needs: [checks, test, coverage, build, rust, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
