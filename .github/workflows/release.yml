name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run the release pipeline (quality + all platform builds, timings and
  # artifacts included) without publishing — publish/AUR only run on a v* tag
  # push. Dispatched on a v* tag it builds what the release would; on a branch
  # it builds the public edition, because the edition package's deploy key is in
  # the `release` environment, which admits only v* tags.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Installs up to 3.6.x run the Electron app, whose updater reads
  # latest-mac.yml / latest-linux.yml / latest.yml. While this is "1" a release
  # also publishes those, pointing at this app, and the macOS bundle carries the
  # placeholder file that updater insists on (docs/desktop.md, "Moving Electron
  # installs"). Delete this line once those installs have moved.
  COGPIT_ELECTRON_BRIDGE: "1"
  ARCHLINUX_IMAGE: archlinux:base@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433 # base-20260712.0.555161

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  # quality.yml checks the public build; this checks the release build, which
  # carries the edition package, and that a build without it leaks none of it.
  team-quality:
    # A branch dry-run has no access to the edition package.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}
          require-merged: "true"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: bun run lint

      - name: Check architecture boundaries
        run: bun run check:architecture

      - name: Check agent-vocabulary containment
        run: bun run check:agents

      - name: Type-check production code
        run: bun run typecheck

      - name: Type-check tests
        run: bun run typecheck:tests

      - name: Build Rust core
        run: bun run build:core

      - name: Test with the edition package
        run: bun run test

      - name: Build the web app with the edition UI
        env:
          COGPIT_EXPECT_EDITION_UI: present
        run: bun run build:web

      - name: Build the web app as a public clone
        env:
          COGPIT_WITHOUT_TEAM: "1"
          COGPIT_EXPECT_EDITION_UI: absent
        run: bun run build:web --outDir "$RUNNER_TEMP/public-dist"

      - name: Check the public build carries none of the edition package
        run: bun editions/team/tools/check-public-bundle.ts "$RUNNER_TEMP/public-dist"

  # cogpit-core for every platform Cogpit ships on. The desktop apps bundle
  # theirs; the npm launcher carries all five. Linux builds are static (musl),
  # so one binary runs on any distro, however old its glibc.
  core:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    name: core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version.
      - name: Install the Rust toolchain
        shell: bash
        run: rustup toolchain install && rustup target add "${{ matrix.target }}"

      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Build cogpit-core
        shell: bash
        run: cargo build --locked --release -p cogpit-core --target "${{ matrix.target }}"

      - name: Require a static Linux binary
        if: runner.os == 'Linux'
        run: |
          file "target/${{ matrix.target }}/release/cogpit-core"
          file "target/${{ matrix.target }}/release/cogpit-core" | grep -Eq 'static(ally|-pie) linked'

      # core-dist/<platform>/cogpit-core, the layout packages/cogpit-cli ships.
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p "core-dist/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/cogpit-core${{ runner.os == 'Windows' && '.exe' || '' }}" "core-dist/${{ matrix.platform }}/"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.platform }}
          path: core-dist
          if-no-files-found: error

  desktop:
    # Intentionally NOT gated on quality: builds and quality run in parallel
    # (saves the full quality duration off the release critical path).
    # `publish` requires BOTH, so no artifact ships without a green quality run.
    needs: [core]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app per architecture on macOS, each built on its own hardware.
          - name: macOS arm64
            os: macos-latest
            core: darwin-arm64
            bundles: app,dmg
          - name: macOS x64
            os: macos-15-intel
            core: darwin-x64
            bundles: app,dmg
          # The oldest Ubuntu runner: the app and its AppImage need no newer glibc than 22.04's.
          # The deb is only the input of the pacman package.
          - name: Linux
            os: ubuntu-22.04
            core: linux-x64
            bundles: appimage,deb
          - name: Windows
            os: windows-latest
            core: win32-x64
            bundles: nsis

    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The edition package's deploy key and the update signing key live in the
    # `release` environment, which admits only v* tags. A dry-run on a branch
    # builds the public edition and signs with a throwaway key.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf file libarchive-tools

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          workspaces: desktop -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download cogpit-core
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-${{ matrix.core }}
          path: core-dist

      # The desktop updater only installs files signed with the key whose
      # public half is in desktop/tauri.conf.json. A release without it would
      # strand every install, so a tag build refuses to go on. A dry-run signs
      # with a key made here and thrown away.
      - name: Check the update signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEY" ]; then exit 0; fi
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "The release environment has no TAURI_SIGNING_PRIVATE_KEY secret." >&2
            exit 1
          fi
          bunx tauri signer generate --ci -p dry-run -w "$RUNNER_TEMP/dry-run.key" > /dev/null
          echo "DRY_RUN_SIGNING_KEY=$(cat "$RUNNER_TEMP/dry-run.key")" >> "$GITHUB_ENV"

      - name: Build the desktop app (${{ matrix.name }})
        # windows-latest defaults to pwsh; Git Bash keeps the command shape
        # identical across every runner.
        shell: bash
        env:
          # Fail closed: a release never ships without the edition UI.
          COGPIT_EXPECT_EDITION_UI: ${{ startsWith(github.ref, 'refs/tags/v') && 'present' || 'absent' }}
          COGPIT_CORE_PREBUILT: core-dist/${{ matrix.core }}/cogpit-core${{ runner.os == 'Windows' && '.exe' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || env.DRY_RUN_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || 'dry-run' }}
          # Ad-hoc signed unless the owner adds a Developer ID (docs/desktop.md).
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_IDENTITY" ]; then export APPLE_SIGNING_IDENTITY="$APPLE_IDENTITY"; fi
          bun run desktop:build --bundles "${{ matrix.bundles }}"

      - name: Collect the release files
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || env.DRY_RUN_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || 'dry-run' }}
        run: bun scripts/release-artifacts.ts collect release

      # The package is put together by scripts/lib/pacmanPackage.ts, not by
      # makepkg, so pacman itself has the last word: it must install over the
      # unowned /usr/bin/cogpit link that packages up to 3.6.x left behind,
      # verify clean, and find every library the app links against.
      - name: Install the pacman package on Arch Linux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/release:/release:ro" "$ARCHLINUX_IMAGE" bash -euc '
            ln -s /opt/Cogpit/cogpit /usr/bin/cogpit
            pacman -Syu --noconfirm > /dev/null
            pacman -U --noconfirm /release/cogpit-*.pacman
            test "$(readlink -f /usr/bin/cogpit)" = /opt/Cogpit/cogpit
            pacman -Qkk cogpit
            if ldd /opt/Cogpit/cogpit | grep "not found"; then exit 1; fi
            pacman -R --noconfirm cogpit
            test ! -e /usr/bin/cogpit && test ! -L /usr/bin/cogpit
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: release
          if-no-files-found: error

  # Every platform's files in one place, with the update manifests written
  # over them. Runs on dry-runs too, so a broken release shows before a tag.
  assemble:
    needs: [desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Require the tag to match the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version package.json)"

      # On a tag every update file must carry the signature of the key
      # installed apps trust; a dry-run's throwaway key cannot pass that.
      - name: Write the update manifests and verify the release
        run: bun scripts/release-artifacts.ts manifests artifacts ${{ startsWith(github.ref, 'refs/tags/v') && '--verify' || '' }}

      - name: Show the update manifests
        run: cat artifacts/latest*

      - name: Upload the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-release
          path: artifacts
          if-no-files-found: error

  publish:
    needs: [quality, team-quality, assemble]
    # Skipped on workflow_dispatch dry-runs; update-aur chains off publish and
    # skips with it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [quality, team-quality, core, assemble]
    # Same gate as `publish`: dry-runs build but never ship.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance attestation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The cogpit package bundles the web app, edition UI included.
      - uses: ./.github/actions/team-checkout
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # core-dist/<platform>-<arch>/cogpit-core for every target; the package
      # build copies them into dist/core/ (COGPIT_CORE_DIST).
      - name: Download cogpit-core for every platform
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          path: core-dist
          merge-multiple: true

      # The tag is the single source of truth for the shipped version, exactly
      # as it is for the two AUR packages. --allow-same-version keeps this a
      # no-op when package.json was already bumped in the release commit.
      - name: Stamp the release version
        working-directory: packages/cogpit-cli
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # `prepublishOnly` runs the unit tests, builds dist/, and verifies the
      # package contract against the stamped version before anything uploads:
      # every platform's core is in the package and the server starts on this one's.
      - name: Publish cogpit to npm
        working-directory: packages/cogpit-cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          COGPIT_EXPECT_EDITION_UI: present
          COGPIT_CORE_DIST: ${{ github.workspace }}/core-dist

      # cogpit-memory's own prepublishOnly build needs this package's deps
      # (esbuild, tsc); the root install does not provide them.
      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      # cogpit-memory keeps its own 0.x line instead of the app's tag version,
      # so it ships whatever package.json declares and no-ops on tags where
      # that version already went out.
      - name: Publish cogpit-memory to npm
        working-directory: packages/cogpit-memory
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "cogpit-memory@${version}" version >/dev/null 2>&1; then
            echo "cogpit-memory@${version} is already on npm - skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-aur:
    needs: [quality, team-quality, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cogpit
            repo: cogpit.git
            template: aur/PKGBUILD.template
            needsChecksum: true
            extraFile: cogpit.install
          - name: cogpit-server
            repo: cogpit-server.git
            template: aur/PKGBUILD-server.template
            needsChecksum: false
            extraFile: cogpit-server.service

    name: update-aur (${{ matrix.name }})

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "pkgver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download .pacman from release
        if: matrix.needsChecksum
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "cogpit-*.pacman" \
            --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute checksum
        if: matrix.needsChecksum
        id: checksum
        run: echo "sha256=$(sha256sum cogpit-*.pacman | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/${{ matrix.repo }} aur-repo

      - name: Update PKGBUILD
        run: |
          sed -e 's/%%PKGVER%%/${{ steps.version.outputs.pkgver }}/' \
              -e 's/%%SHA256%%/${{ steps.checksum.outputs.sha256 }}/' \
              ${{ matrix.template }} > aur-repo/PKGBUILD

      - name: Copy package extras
        if: matrix.extraFile != ''
        run: cp "aur/${{ matrix.extraFile }}" aur-repo/

      - name: Generate .SRCINFO
        run: |
          cd aur-repo
          docker run --rm -v "$PWD:/pkg" "$ARCHLINUX_IMAGE" bash -c \
            "pacman -Syu --noconfirm pacman-contrib && useradd -m builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push to AUR
        run: |
          cd aur-repo
          sudo chown -R "$(id -u):$(id -g)" .
          git config user.name "Gentrit Biba"
          git config user.email "gentritbiba@gmail.com"
          git add PKGBUILD .SRCINFO ${{ matrix.extraFile }}
          git commit -m "Update to ${{ steps.version.outputs.pkgver }}"
          git push
