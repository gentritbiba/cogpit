name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run the release pipeline (quality + all platform builds, timings and
  # artifacts included) without publishing — publish/AUR only run on a v* tag
  # push. Dispatched on a v* tag it builds what the release would; on a branch
  # it builds the public edition, because the edition package's deploy key is in
  # the `release` environment, which admits only v* tags.
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHLINUX_IMAGE: archlinux:base@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433 # base-20260712.0.555161

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  # quality.yml checks the public build; this checks the release build, which
  # carries the edition package, and that a build without it leaks none of it.
  team-quality:
    # A branch dry-run has no access to the edition package.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}
          require-merged: "true"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: bun run lint

      - name: Check architecture boundaries
        run: bun run check:architecture

      - name: Check agent-vocabulary containment
        run: bun run check:agents

      - name: Type-check production code
        run: bun run typecheck

      - name: Type-check tests
        run: bun run typecheck:tests

      - name: Build Rust core
        run: bun run build:core

      - name: Test with the edition package
        run: bun run test

      - name: Build the web app with the edition UI
        env:
          COGPIT_EXPECT_EDITION_UI: present
        run: bun run build:web

      - name: Build the web app as a public clone
        env:
          COGPIT_WITHOUT_TEAM: "1"
          COGPIT_EXPECT_EDITION_UI: absent
        run: bun run build:web --outDir "$RUNNER_TEMP/public-dist"

      - name: Check the public build carries none of the edition package
        run: bun editions/team/tools/check-public-bundle.ts "$RUNNER_TEMP/public-dist"

  # cogpit-core for every platform Cogpit ships on. The desktop apps carry
  # their platform's; the npm launcher carries all five. Linux builds are static
  # (musl), so one binary runs on any distro, however old its glibc.
  core:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    name: core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version.
      - name: Install the Rust toolchain
        shell: bash
        run: rustup toolchain install && rustup target add "${{ matrix.target }}"

      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Build cogpit-core
        shell: bash
        run: cargo build --locked --release -p cogpit-core --target "${{ matrix.target }}"

      - name: Require a static Linux binary
        if: runner.os == 'Linux'
        run: |
          file "target/${{ matrix.target }}/release/cogpit-core"
          file "target/${{ matrix.target }}/release/cogpit-core" | grep -Eq 'static(ally|-pie) linked'

      # core-dist/<platform>-<arch>/, the layout electron-builder and the npm
      # package take it from (bun run build:core --release --stage locally).
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p "core-dist/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/cogpit-core${{ runner.os == 'Windows' && '.exe' || '' }}" "core-dist/${{ matrix.platform }}/"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.platform }}
          path: core-dist
          if-no-files-found: error

  build:
    # Intentionally NOT gated on quality: builds and quality run in parallel
    # (saves the full quality duration off the release critical path).
    # `publish` requires BOTH, so no artifact ships without a green quality run.
    needs: [core]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bun run <script> -- <args>` appends to the END of the whole script
          # string, so the target flags used to land on a trailing command
          # instead of electron-builder. Invoke electron-builder directly.
          # Each pattern also carries the update manifest (latest*.yml) and the
          # files the in-app updater downloads: the mac zips, the Windows
          # blockmap for differential downloads. `core` picks the cogpit-core
          # builds each app carries.
          - os: macos-latest
            name: macOS
            core: darwin-*
            cmd: bun run electron:build && bunx electron-builder --mac --arm64 --x64 --publish never
            pattern: |
              release/*.dmg
              release/*-mac.zip
              release/latest-mac.yml
          - os: ubuntu-latest
            name: Linux (AppImage)
            core: linux-x64
            cmd: bun run electron:build && bunx electron-builder --linux AppImage --x64 --publish never
            manifest: latest-linux-appimage.yml
            pattern: |
              release/*.AppImage
              release/latest-linux-appimage.yml
          - os: ubuntu-latest
            name: Linux (pacman)
            core: linux-x64
            cmd: bun run electron:build && bunx electron-builder --linux pacman --x64 --publish never
            manifest: latest-linux-pacman.yml
            pattern: |
              release/*.pacman
              release/latest-linux-pacman.yml
          - os: windows-latest
            name: Windows
            core: win32-x64
            cmd: bun run electron:build && bunx electron-builder --win nsis --x64 --publish never
            pattern: |
              release/*-setup.exe
              release/*-setup.exe.blockmap
              release/latest.yml

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The edition package's deploy key lives in the `release` environment, which
    # admits only v* tags. A dry-run on a branch builds the public edition.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"

      # Electron + electron-builder binary downloads (~100MB per run otherwise)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Download cogpit-core
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-${{ matrix.core }}
          path: core-dist
          merge-multiple: true

      # Artifacts do not keep file modes.
      - name: Mark cogpit-core executable
        if: runner.os != 'Windows'
        run: chmod 755 core-dist/*/cogpit-core

      - name: Build and package (${{ matrix.name }})
        # windows-latest defaults to pwsh; Git Bash keeps the command shape
        # identical across every runner.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Fail closed: a release never ships without the edition UI.
          COGPIT_EXPECT_EDITION_UI: ${{ startsWith(github.ref, 'refs/tags/v') && 'present' || 'absent' }}
        run: ${{ matrix.cmd }}

      # Both Linux jobs write latest-linux.yml; publish merges the two.
      - name: Name the Linux update manifest
        if: matrix.manifest
        run: mv release/latest-linux.yml "release/${{ matrix.manifest }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Every platform's files in one place, the two Linux update manifests merged,
  # and the whole set checked. Runs on dry-runs too, so a broken release shows
  # before a tag.
  assemble:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      # electron-updater on Linux reads one latest-linux.yml for both the
      # AppImage and the pacman package and picks its file by extension.
      # The AppImage goes last so the legacy top-level path describes it.
      - name: Merge the Linux update manifests
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          if [ "$(yq -N '.version' latest-linux-pacman.yml latest-linux-appimage.yml | sort -u | wc -l)" -ne 1 ]; then
            echo "The Linux update manifests disagree on the version" >&2
            exit 1
          fi
          yq eval-all '. as $m ireduce ({}; . *+ $m)' latest-linux-pacman.yml latest-linux-appimage.yml > latest-linux.yml
          rm latest-linux-pacman.yml latest-linux-appimage.yml
          cat latest-linux.yml

      # The installed apps compare the manifests' version with their own.
      - name: Require the tag to match the built version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: artifacts
        run: |
          for manifest in latest-mac.yml latest-linux.yml latest.yml; do
            test "${GITHUB_REF_NAME#v}" = "$(yq -N '.version' "$manifest")"
          done

      - name: Verify release artifact manifest
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          for pattern in "*.dmg" "*.AppImage" "*.pacman" "*-setup.exe" latest-mac.yml latest-linux.yml latest.yml; do
            if ! find . -maxdepth 1 -type f -name "$pattern" -print -quit | grep -q .; then
              echo "Missing required release artifact: $pattern" >&2
              exit 1
            fi
          done

          if find . -maxdepth 1 -type f \
            ! -name "*.dmg" \
            ! -name "*-mac.zip" \
            ! -name "*.AppImage" \
            ! -name "*.pacman" \
            ! -name "*-setup.exe" \
            ! -name "*-setup.exe.blockmap" \
            ! -name "latest*.yml" \
            -print -quit | grep -q .; then
            echo "Release artifact manifest contains an unexpected file type" >&2
            find . -maxdepth 1 -type f -print >&2
            exit 1
          fi

          # Every installed build must find its own update file in a manifest,
          # and every file a manifest lists must ship with the release.
          expect() {
            if [ "$(yq "[.files[].url | select(test(\"$2\"))] | length" "$1")" -ne 1 ]; then
              echo "$1 does not list exactly one file matching $2" >&2
              exit 1
            fi
          }
          expect latest-mac.yml '-arm64-mac\.zip$'
          expect latest-mac.yml '\.[0-9]+-mac\.zip$'
          expect latest-linux.yml '\.AppImage$'
          expect latest-linux.yml '\.pacman$'
          expect latest.yml '-setup\.exe$'
          for file in $(yq -N '.files[].url' latest-mac.yml latest-linux.yml latest.yml); do
            if [ ! -f "$file" ]; then
              echo "An update manifest lists $file, which is not in the release" >&2
              exit 1
            fi
          done

      # Installs up to 3.6.x update from these zips with an updater that never
      # checks for cogpit-core, and the app cannot start without it.
      - name: Require cogpit-core in every macOS update
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          for zip in *-mac.zip; do
            unzip -Z1 "$zip" | grep -x 'Cogpit.app/Contents/Resources/bin/cogpit-core' > /dev/null || {
              echo "$zip has no Cogpit.app/Contents/Resources/bin/cogpit-core" >&2
              exit 1
            }
          done

      - name: Upload the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-release
          path: artifacts
          if-no-files-found: error

  publish:
    needs: [quality, team-quality, assemble]
    # Skipped on workflow_dispatch dry-runs, which run on a tag too; update-aur
    # chains off publish and skips with it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [quality, team-quality, core, assemble]
    # Same gate as `publish`: dry-runs build but never ship.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance attestation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The cogpit package bundles the web app, edition UI included.
      - uses: ./.github/actions/team-checkout
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # core-dist/<platform>-<arch>/cogpit-core for every target; the package
      # build copies them into dist/core/ (COGPIT_CORE_DIST).
      - name: Download cogpit-core for every platform
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          path: core-dist
          merge-multiple: true

      # The tag is the single source of truth for the shipped version, exactly
      # as it is for the two AUR packages. --allow-same-version keeps this a
      # no-op when package.json was already bumped in the release commit.
      - name: Stamp the release version
        working-directory: packages/cogpit-cli
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # `prepublishOnly` runs the unit tests, builds dist/, and verifies the
      # package contract against the stamped version before anything uploads:
      # every platform's core is in the package and the server starts on this one's.
      - name: Publish cogpit to npm
        working-directory: packages/cogpit-cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          COGPIT_EXPECT_EDITION_UI: present
          COGPIT_CORE_DIST: ${{ github.workspace }}/core-dist

      # cogpit-memory's own prepublishOnly build needs this package's deps
      # (esbuild, tsc); the root install does not provide them.
      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      # cogpit-memory keeps its own 0.x line instead of the app's tag version,
      # so it ships whatever package.json declares and no-ops on tags where
      # that version already went out.
      - name: Publish cogpit-memory to npm
        working-directory: packages/cogpit-memory
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "cogpit-memory@${version}" version >/dev/null 2>&1; then
            echo "cogpit-memory@${version} is already on npm - skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-aur:
    needs: [quality, team-quality, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cogpit
            repo: cogpit.git
            template: aur/PKGBUILD.template
            needsChecksum: true
            extraFile: ''
          - name: cogpit-server
            repo: cogpit-server.git
            template: aur/PKGBUILD-server.template
            needsChecksum: false
            extraFile: cogpit-server.service

    name: update-aur (${{ matrix.name }})

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "pkgver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download .pacman from release
        if: matrix.needsChecksum
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "cogpit-*.pacman" \
            --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute checksum
        if: matrix.needsChecksum
        id: checksum
        run: echo "sha256=$(sha256sum cogpit-*.pacman | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/${{ matrix.repo }} aur-repo

      - name: Update PKGBUILD
        run: |
          sed -e 's/%%PKGVER%%/${{ steps.version.outputs.pkgver }}/' \
              -e 's/%%SHA256%%/${{ steps.checksum.outputs.sha256 }}/' \
              ${{ matrix.template }} > aur-repo/PKGBUILD

      - name: Copy package extras
        if: matrix.extraFile != ''
        run: cp "aur/${{ matrix.extraFile }}" aur-repo/

      - name: Generate .SRCINFO
        run: |
          cd aur-repo
          docker run --rm -v "$PWD:/pkg" "$ARCHLINUX_IMAGE" bash -c \
            "pacman -Syu --noconfirm pacman-contrib && useradd -m builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push to AUR
        run: |
          cd aur-repo
          sudo chown -R "$(id -u):$(id -g)" .
          git config user.name "Gentrit Biba"
          git config user.email "gentritbiba@gmail.com"
          git add PKGBUILD .SRCINFO ${{ matrix.extraFile }}
          git commit -m "Update to ${{ steps.version.outputs.pkgver }}"
          git push
