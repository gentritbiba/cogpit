name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run the release pipeline (quality + all platform builds, timings and
  # artifacts included) without publishing — the publish steps only run on a
  # v* tag push. Dispatched on a v* tag it builds what the release would; on a
  # branch it builds the public edition, because the edition package's deploy
  # key is in the `release` environment, which admits only v* tags.
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHLINUX_IMAGE: archlinux:base@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433 # base-20260712.0.555161
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

# Nothing waits on anything it does not need: the cores, the app builds, the
# npm packages and quality all start at once. The builds and the npm packages
# pick up the cores when they are ready (await-artifacts), and only `publish`
# waits for everything. The account runs at most 20 jobs at once, the master
# push's Quality included, so the release keeps its own job count low.
jobs:
  core:
    uses: ./.github/workflows/core.yml

  build:
    # Starts with the cores, not after them: it builds the app first and waits
    # for its cores only before packaging.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bun run <script> -- <args>` appends to the END of the whole script
          # string, so the target flags used to land on a trailing command
          # instead of electron-builder. Invoke electron-builder directly.
          # Each pattern also carries the update manifest (latest*.yml) and the
          # files the in-app updater downloads: the mac zips, the Windows
          # blockmap for differential downloads. One electron-builder run per
          # platform writes one manifest listing all its files. `cores` names
          # the cogpit-core builds each app carries.
          - os: macos-latest
            name: macOS
            cores: core-darwin-arm64 core-darwin-x64
            package: bunx electron-builder --mac --arm64 --x64 --publish never
            pattern: |
              release/*.dmg
              release/*-mac.zip
              release/latest-mac.yml
          - os: ubuntu-latest
            name: Linux
            cores: core-linux-x64
            package: bunx electron-builder --linux AppImage pacman --x64 --publish never
            pattern: |
              release/*.AppImage
              release/*.pacman
              release/latest-linux.yml
          - os: windows-latest
            name: Windows
            cores: core-win32-x64
            package: bunx electron-builder --win nsis --x64 --publish never
            pattern: |
              release/*-setup.exe
              release/*-setup.exe.blockmap
              release/latest.yml

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The edition package's deploy key lives in the `release` environment, which
    # admits only v* tags. A dry-run on a branch builds the public edition.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    # windows-latest defaults to pwsh; Git Bash keeps the commands identical.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      # Electron + electron-builder binary downloads (~100MB per run otherwise)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - uses: ./.github/actions/setup-js

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build the app
        env:
          # Fail closed: a release never ships without the edition UI.
          COGPIT_EXPECT_EDITION_UI: ${{ startsWith(github.ref, 'refs/tags/v') && 'present' || 'absent' }}
        run: bun run electron:build

      - uses: ./.github/actions/await-artifacts
        with:
          names: ${{ matrix.cores }}
          producer: core / core (
          path: core-dist

      # Artifacts do not keep file modes.
      - name: Mark cogpit-core executable
        if: runner.os != 'Windows'
        run: chmod 755 core-dist/*/cogpit-core

      - name: Package (${{ matrix.name }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.package }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          compression-level: 0

  # The npm packages, built and checked now and published with the rest.
  # `npm publish` of a folder would run prepublishOnly; these steps are that
  # script's, so the tarballs publish as they are.
  npm-pack:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The cogpit package bundles the web app, edition UI included.
      - uses: ./.github/actions/team-checkout
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      - uses: ./.github/actions/setup-js
        with:
          memory: "true"

      # The tag is the single source of truth for the shipped version, exactly
      # as it is for the two AUR packages.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cogpit-cli
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Test the cogpit package
        working-directory: packages/cogpit-cli
        run: bun run test

      # core-dist/<platform>-<arch>/cogpit-core for every target; the package
      # build copies them into dist/core/ (COGPIT_CORE_DIST).
      - uses: ./.github/actions/await-artifacts
        with:
          names: core-darwin-arm64 core-darwin-x64 core-linux-x64 core-linux-arm64 core-win32-x64
          producer: core / core (
          path: core-dist

      # Every platform's core is in the package and the server starts on this one's.
      - name: Build the cogpit package and check its contract
        working-directory: packages/cogpit-cli
        env:
          COGPIT_EXPECT_EDITION_UI: ${{ startsWith(github.ref, 'refs/tags/v') && 'present' || 'absent' }}
          COGPIT_CORE_DIST: ${{ github.workspace }}/core-dist
        run: bun run test:contracts

      - name: Build the cogpit-memory package
        working-directory: packages/cogpit-memory
        run: bun run build:npm

      - name: Pack both
        run: |
          mkdir npm-out
          (cd packages/cogpit-cli && npm pack --ignore-scripts --pack-destination ../../npm-out)
          (cd packages/cogpit-memory && npm pack --ignore-scripts --pack-destination ../../npm-out)
          ls -l npm-out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm
          path: npm-out
          if-no-files-found: error

  # The master push that comes with a release tag already runs Quality on the
  # tagged commit; the release waits for that run instead of repeating it.
  find-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}

    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The branch push can reach GitHub a few seconds after the tag.
          for _ in $(seq 12); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
            if [ -n "$id" ]; then
              echo "Quality run $id checks $GITHUB_SHA"
              echo "run-id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "No pushed Quality run checks $GITHUB_SHA; this release runs its own."

  # A called workflow gets at most its caller's permissions; Quality's
  # version-bump job reads other runs.
  quality:
    needs: [find-quality]
    if: needs.find-quality.outputs.run-id == ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/quality.yml

  # Quality on the build that ships: with the edition package, and its public
  # build checked to leak none of it. A branch dry-run has no access to it.
  edition-quality:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/quality.yml
    with:
      edition: true
    secrets: inherit

  # The AUR packages: rendered once the pacman package's checksum is known
  # (makepkg needs an Arch container), and pushed after the GitHub release
  # they point at exists. Neither can hold up the GitHub release or npm, and
  # both rerun on their own.
  aur-prep:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-Linux
          path: release

      - name: Render the AUR packages
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = true ]; then pkgver="${GITHUB_REF_NAME#v}"; else pkgver=$(node -p "require('./package.json').version"); fi
          sha256=$(sha256sum release/cogpit-*.pacman | cut -d' ' -f1)
          mkdir -p aur-out/cogpit aur-out/cogpit-server
          sed -e "s/%%PKGVER%%/$pkgver/" -e "s/%%SHA256%%/$sha256/" aur/PKGBUILD.template > aur-out/cogpit/PKGBUILD
          sed -e "s/%%PKGVER%%/$pkgver/" -e "s/%%SHA256%%//" aur/PKGBUILD-server.template > aur-out/cogpit-server/PKGBUILD
          cp aur/cogpit-server.service aur-out/cogpit-server/
          docker run --rm -v "$PWD/aur-out:/pkg" "$ARCHLINUX_IMAGE" bash -c \
            "pacman -Syu --noconfirm pacman-contrib && useradd -m builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg/cogpit && makepkg --printsrcinfo > .SRCINFO && cd /pkg/cogpit-server && makepkg --printsrcinfo > .SRCINFO'"
          sudo chown -R "$(id -u):$(id -g)" aur-out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aur
          path: aur-out
          include-hidden-files: true
          if-no-files-found: error

  # Every platform's files in one place and the whole set checked, then (on a
  # tag push) the GitHub release and npm, once both quality runs are green;
  # update-aur follows the GitHub release. It waits for quality itself rather than in a job of its own, which
  # would hold one of the account's runners for the whole release. The checks
  # run on dry-runs too, so a broken release shows before a tag.
  publish:
    needs: [build, npm-pack, find-quality, quality, edition-quality]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.npm-pack.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write # rerun a flaky Quality run
      contents: write
      id-token: write # npm provenance attestation

    steps:
      - name: Require both quality runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.find-quality.outputs.run-id }}
          FIND: ${{ needs.find-quality.result }}
          QUALITY: ${{ needs.quality.result }}
          EDITION: ${{ needs.edition-quality.result }}
        run: |
          set -euo pipefail
          [ "$FIND" = success ] || { echo "::error::find-quality: $FIND"; exit 1; }
          if [ "$IS_TAG" = true ] && [ "$EDITION" != success ]; then
            echo "::error::Edition quality: $EDITION"
            exit 1
          fi
          if [ -z "$RUN_ID" ]; then
            [ "$QUALITY" = success ] || { echo "::error::Quality: $QUALITY"; exit 1; }
            exit 0
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          state() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '"\(.status) \(.conclusion)"' || echo "unknown -"; }
          # A failed run gets its failed jobs rerun once: most failures there
          # are a test timing out on a loaded runner, and a rerun is what a
          # person would do anyway.
          rerun=false
          echo "Waiting for $url"
          while :; do
            read -r status conclusion <<<"$(state)"
            if [ "$status" != completed ]; then sleep 10; continue; fi
            [ "$conclusion" = success ] && exit 0
            if [ "$conclusion" = failure ] && [ "$rerun" = false ]; then
              echo "::warning::Quality for this commit failed; rerunning its failed jobs once: $url"
              gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
              rerun=true
              until read -r status _ <<<"$(state)" && [ "$status" != completed ]; do sleep 5; done
              continue
            fi
            echo "::error::Quality for this commit concluded $conclusion: $url. Rerun its failed jobs there, then rerun this job."
            exit 1
          done

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      # The installed apps compare the manifests' version with their own.
      - name: Require the tag to match the built version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: artifacts
        run: |
          for manifest in latest-mac.yml latest-linux.yml latest.yml; do
            test "${GITHUB_REF_NAME#v}" = "$(yq -N '.version' "$manifest")"
          done

      - name: Verify release artifact manifest
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          for pattern in "*.dmg" "*.AppImage" "*.pacman" "*-setup.exe" latest-mac.yml latest-linux.yml latest.yml; do
            if ! find . -maxdepth 1 -type f -name "$pattern" -print -quit | grep -q .; then
              echo "Missing required release artifact: $pattern" >&2
              exit 1
            fi
          done

          if find . -maxdepth 1 -type f \
            ! -name "*.dmg" \
            ! -name "*-mac.zip" \
            ! -name "*.AppImage" \
            ! -name "*.pacman" \
            ! -name "*-setup.exe" \
            ! -name "*-setup.exe.blockmap" \
            ! -name "latest*.yml" \
            -print -quit | grep -q .; then
            echo "Release artifact manifest contains an unexpected file type" >&2
            find . -maxdepth 1 -type f -print >&2
            exit 1
          fi

          # Every installed build must find its own update file in a manifest,
          # and every file a manifest lists must ship with the release.
          expect() {
            if [ "$(yq "[.files[].url | select(test(\"$2\"))] | length" "$1")" -ne 1 ]; then
              echo "$1 does not list exactly one file matching $2" >&2
              exit 1
            fi
          }
          expect latest-mac.yml '-arm64-mac\.zip$'
          expect latest-mac.yml '\.[0-9]+-mac\.zip$'
          expect latest-linux.yml '\.AppImage$'
          expect latest-linux.yml '\.pacman$'
          expect latest.yml '-setup\.exe$'
          for file in $(yq -N '.files[].url' latest-mac.yml latest-linux.yml latest.yml); do
            if [ ! -f "$file" ]; then
              echo "An update manifest lists $file, which is not in the release" >&2
              exit 1
            fi
          done

      # Installs up to 3.6.x update from these zips with an updater that never
      # checks for cogpit-core, and the app cannot start without it.
      - name: Require cogpit-core in every macOS update
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          for zip in *-mac.zip; do
            unzip -Z1 "$zip" | grep -x 'Cogpit.app/Contents/Resources/bin/cogpit-core' > /dev/null || {
              echo "$zip has no Cogpit.app/Contents/Resources/bin/cogpit-core" >&2
              exit 1
            }
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm
          path: npm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: "22.16"
          registry-url: https://registry.npmjs.org

      # cogpit takes the tag's version; cogpit-memory keeps its own 0.x line
      # and ships whatever its package.json declares. A version npm already
      # has is skipped, so publish can rerun: npm refuses it outright, and its
      # registry can take minutes to list a new one.
      - name: Publish cogpit and cogpit-memory to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          publish() {
            local spec=$1 tarball=$2
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm - skipping."
              return
            fi
            if ! npm publish "$tarball" --provenance --access public --ignore-scripts 2> npm-error.log; then
              cat npm-error.log >&2
              grep -q "previously published" npm-error.log || return 1
              echo "$spec was already published."
            fi
          }
          publish "cogpit@${GITHUB_REF_NAME#v}" "$(ls npm/cogpit-[0-9]*.tgz)"
          memory=$(ls npm/cogpit-memory-*.tgz)
          version=${memory#npm/cogpit-memory-}
          publish "cogpit-memory@${version%.tgz}" "$memory"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-aur:
    needs: [publish, aur-prep]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aur
          path: aur

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' >> ~/.ssh/config
          git config --global user.name "Gentrit Biba"
          git config --global user.email "gentritbiba@gmail.com"
          push() {
            local package=$1; shift
            git clone "ssh://aur@aur.archlinux.org/$package.git" "aur-repo-$package"
            for file in "$@"; do cp "aur/$package/$file" "aur-repo-$package/"; done
            git -C "aur-repo-$package" add "$@"
            # A rerun after a push finds nothing to commit.
            git -C "aur-repo-$package" diff --cached --quiet || git -C "aur-repo-$package" commit -m "Update to ${GITHUB_REF_NAME#v}"
            git -C "aur-repo-$package" push
          }
          push cogpit PKGBUILD .SRCINFO
          push cogpit-server PKGBUILD .SRCINFO cogpit-server.service
