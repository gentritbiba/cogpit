name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run the release pipeline (quality + all platform builds, timings and
  # artifacts included) without publishing — publish/AUR only run on a v* tag
  # push. Dispatch it on a v* tag: the jobs that build with the edition package
  # read its deploy key from the `release` environment, which admits only v* tags.
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHLINUX_IMAGE: archlinux:base@sha256:fe6972d4dc1f660c0c10f4c41b2de8986bab89e7e2955378f8beadb8ebcd7433 # base-20260712.0.555161

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  # quality.yml checks the public build; this checks the release build, which
  # carries the edition package, and that a build without it leaks none of it.
  team-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}
          require-merged: "true"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check architecture boundaries
        run: bun run check:architecture

      - name: Check agent-vocabulary containment
        run: bun run check:agents

      - name: Type-check production code
        run: bun run typecheck

      - name: Type-check tests
        run: bun run typecheck:tests

      - name: Test with the edition package
        run: bun run test

      - name: Build the web app with the edition UI
        env:
          COGPIT_EXPECT_EDITION_UI: present
        run: bun run build:web

      - name: Build the web app as a public clone
        env:
          COGPIT_WITHOUT_TEAM: "1"
          COGPIT_EXPECT_EDITION_UI: absent
        run: bun run build:web --outDir "$RUNNER_TEMP/public-dist"

      - name: Check the public build carries none of the edition package
        run: bun editions/team/tools/check-public-bundle.ts "$RUNNER_TEMP/public-dist"

  build:
    # Intentionally NOT gated on quality: builds and quality run in parallel
    # (saves the full quality duration off the release critical path).
    # `publish` requires BOTH, so no artifact ships without a green quality run.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bun run <script> -- <args>` appends to the END of the whole script
          # string, so the target flags used to land on a trailing command
          # instead of electron-builder. Invoke electron-builder directly.
          - os: macos-latest
            name: macOS
            cmd: bun run electron:build && bunx electron-builder --mac --arm64 --x64 --publish never
            pattern: "release/*.dmg"
          - os: ubuntu-latest
            name: Linux (AppImage)
            cmd: bun run electron:build && bunx electron-builder --linux AppImage --x64 --publish never
            pattern: "release/*.AppImage"
          - os: ubuntu-latest
            name: Linux (pacman)
            cmd: bun run electron:build && bunx electron-builder --linux pacman --x64 --publish never
            pattern: "release/*.pacman"
          - os: windows-latest
            name: Windows
            cmd: bun run electron:build && bunx electron-builder --win nsis --x64 --publish never
            pattern: "release/*.exe"

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    environment: release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/team-checkout
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Electron + electron-builder binary downloads (~100MB per run otherwise)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build and package (${{ matrix.name }})
        # windows-latest defaults to pwsh; Git Bash keeps the command shape
        # identical across every runner.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Fail closed: a release never ships without the edition UI.
          COGPIT_EXPECT_EDITION_UI: present
        run: ${{ matrix.cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  publish:
    needs: [quality, team-quality, build]
    # Skipped on workflow_dispatch dry-runs, which run on a tag too; update-aur
    # chains off publish and skips with it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Verify release artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          for extension in dmg AppImage pacman exe; do
            if ! find artifacts -maxdepth 1 -type f -name "*.${extension}" -print -quit | grep -q .; then
              echo "Missing required .${extension} release artifact" >&2
              exit 1
            fi
          done

          if find artifacts -maxdepth 1 -type f \
            ! -name "*.dmg" \
            ! -name "*.AppImage" \
            ! -name "*.pacman" \
            ! -name "*.exe" \
            -print -quit | grep -q .; then
            echo "Release artifact manifest contains an unexpected file type" >&2
            find artifacts -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [quality, team-quality, build]
    # Same gate as `publish`: dry-runs build but never ship.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance attestation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The cogpit package bundles the web app, edition UI included.
      - uses: ./.github/actions/team-checkout
        with:
          ssh-key: ${{ secrets.COGPIT_TEAM_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tag is the single source of truth for the shipped version, exactly
      # as it is for the two AUR packages. --allow-same-version keeps this a
      # no-op when package.json was already bumped in the release commit.
      - name: Stamp the release version
        working-directory: packages/cogpit-cli
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # `prepublishOnly` runs the unit tests, builds dist/, and verifies the
      # package contract against the stamped version before anything uploads.
      - name: Publish cogpit to npm
        working-directory: packages/cogpit-cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          COGPIT_EXPECT_EDITION_UI: present

      # cogpit-memory's own prepublishOnly build needs this package's deps
      # (esbuild, tsc); the root install does not provide them.
      - name: Install cogpit-memory dependencies
        working-directory: packages/cogpit-memory
        run: bun install --frozen-lockfile

      # cogpit-memory keeps its own 0.x line instead of the app's tag version,
      # so it ships whatever package.json declares and no-ops on tags where
      # that version already went out.
      - name: Publish cogpit-memory to npm
        working-directory: packages/cogpit-memory
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "cogpit-memory@${version}" version >/dev/null 2>&1; then
            echo "cogpit-memory@${version} is already on npm - skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-aur:
    needs: [quality, team-quality, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cogpit
            repo: cogpit.git
            template: aur/PKGBUILD.template
            needsChecksum: true
            extraFile: ''
          - name: cogpit-server
            repo: cogpit-server.git
            template: aur/PKGBUILD-server.template
            needsChecksum: false
            extraFile: cogpit-server.service

    name: update-aur (${{ matrix.name }})

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "pkgver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download .pacman from release
        if: matrix.needsChecksum
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "cogpit-*.pacman" \
            --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute checksum
        if: matrix.needsChecksum
        id: checksum
        run: echo "sha256=$(sha256sum cogpit-*.pacman | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/${{ matrix.repo }} aur-repo

      - name: Update PKGBUILD
        run: |
          sed -e 's/%%PKGVER%%/${{ steps.version.outputs.pkgver }}/' \
              -e 's/%%SHA256%%/${{ steps.checksum.outputs.sha256 }}/' \
              ${{ matrix.template }} > aur-repo/PKGBUILD

      - name: Copy package extras
        if: matrix.extraFile != ''
        run: cp "aur/${{ matrix.extraFile }}" aur-repo/

      - name: Generate .SRCINFO
        run: |
          cd aur-repo
          docker run --rm -v "$PWD:/pkg" "$ARCHLINUX_IMAGE" bash -c \
            "pacman -Syu --noconfirm pacman-contrib && useradd -m builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push to AUR
        run: |
          cd aur-repo
          sudo chown -R "$(id -u):$(id -g)" .
          git config user.name "Gentrit Biba"
          git config user.email "gentritbiba@gmail.com"
          git add PKGBUILD .SRCINFO ${{ matrix.extraFile }}
          git commit -m "Update to ${{ steps.version.outputs.pkgver }}"
          git push
