name: Set up Bun, Node and the dependencies
description: >
  Installs the pinned Bun and Node and the root dependencies, then builds the
  plugin packages and generated/ once and sets COGPIT_GENERATED_BUILT so the
  scripts that start with build:generated skip it. The install skips lifecycle
  scripts: the only one Cogpit needs is its own postinstall, which is that build.

inputs:
  memory:
    description: Also install packages/cogpit-memory's dependencies (better-sqlite3 needs its install script)
    required: false
    default: "false"
  generated:
    description: Build the plugin packages and generated/
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22.16"

    - name: Install application dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Install cogpit-memory dependencies
      if: inputs.memory == 'true'
      shell: bash
      working-directory: packages/cogpit-memory
      run: bun install --frozen-lockfile

    - name: Build the plugin packages and generated/
      if: inputs.generated == 'true'
      shell: bash
      run: |
        bun run build:generated
        echo "COGPIT_GENERATED_BUILT=1" >> "$GITHUB_ENV"
