<!doctype html>
<!--
  What the window shows the moment the app opens, while the local server starts.
  It matches the window's background so the hand-off to the app is seamless, and
  doubles as a drag handle since the title bar is hidden.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cogpit</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: #09090b; color: #a1a1aa;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  .mark { width: 64px; height: 64px; border-radius: 14px; animation: breathe 1.6s ease-in-out infinite; pointer-events: none; }
  p { pointer-events: none; }
  @keyframes breathe { 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
</style>
</head>
<body data-tauri-drag-region>
  <img class="mark" alt="" src="cogpit.svg">
  <p>Starting Cogpit…</p>
</body>
</html>
