appId: com.cogpit.app
productName: Cogpit
copyright: "Copyright © 2026 Gentrit Biba"

publish:
  provider: github
  owner: gentritbiba
  repo: cogpit

directories:
  output: release
  buildResources: build

asar: true
# cogpit-core (docs/architecture/rust-core.md) runs as its own process, so it
# ships outside the asar. extraResources only warns about a missing source;
# afterPack refuses to package an app without it.
extraResources:
  - from: core-dist/${platform}-${arch}
    to: bin
afterPack: ./build/requireCore.mjs
# "maximum" made the Linux packaging step take ~7 min per target in CI
# (compression-bound); "normal" is 2-4x faster for a few percent larger
# artifacts. Measured 2026-07-21 on the v1.1.3/v1.1.4 release runs.
compression: normal
electronLanguages:
  - en-US

files:
  - out/**/*
  - "!out/**/*.map"
  - "!node_modules/**/*.{md,map,ts,d.ts}"
  - "!node_modules/**/*.test.js"
  - "!node_modules/**/{CHANGELOG,README,LICENSE,LICENCE,readme,changelog}*"
  - "!node_modules/**/{test,tests,__tests__,spec,specs,example,examples,docs}/**"
  # Cogpit requires the installed Claude CLI, so do not ship the SDK's duplicate binary.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/{bridge.mjs,browser-sdk.js,extractFromBunfs.js,manifest.json,manifest.zst.json}"

extraMetadata:
  main: out/main/main.js

mac:
  # No arch here: a local build packages this machine's arch, the one whose core
  # `build:core --stage` built. The release passes --arm64 --x64.
  target:
    - dmg
    # In-app updates download the zip; the dmg is for first installs.
    - zip
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Cogpit records from the microphone only while you dictate a message.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Default is "Cogpit Setup 1.2.0.exe"; the spaces break the release workflow's
  # artifact globbing and diverge from the Cogpit-1.2.0.dmg naming used elsewhere.
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: Cogpit

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: pacman
      arch:
        - x64
  category: Development

pacman:
  # fpm defaults to xz, which is the slowest part of the pacman CI job.
  # zstd is what Arch itself ships — ~5-10x faster to create, near-equal size.
  fpm:
    - "--pacman-compression"
    - "zstd"
  depends:
    - c-ares
    - gcc-libs
    - glibc
    - gtk3
    - libcups
    - libdrm
    - libnotify
    - libxcrypt-compat
    - libxss
    - mesa
    - nss
    - alsa-lib
